<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>struktr preview · PR {{PR}}</title>
<style>
  :root { --brand:#5B4CF5; --bg:#FAFAFC; --ink:#1A1A2E; --muted:#6B6B80; }
  * { box-sizing:border-box }
  body { margin:0; font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--ink);
         display:flex; flex-direction:column; height:100vh }
  header { display:flex; align-items:center; gap:12px; padding:10px 20px; background:#fff;
           border-bottom:1px solid #E5E5EF }
  header .logo { color:var(--brand); font-weight:800; font-size:20px }
  header .meta { color:var(--muted); font-size:14px }
  header .status { margin-left:auto; font-size:13px; padding:4px 10px; border-radius:12px;
                   background:#EFEDFD; color:var(--brand) }
  main { flex:1; display:grid; place-items:center; padding:16px }
  #frame { border:none; width:100%; height:100%; border-radius:12px; background:#000 }
  #wait { text-align:center; color:var(--muted) }
  .spinner { width:36px; height:36px; border:4px solid #EFEDFD; border-top-color:var(--brand);
             border-radius:50%; margin:0 auto 16px; animation:spin 1s linear infinite }
  @keyframes spin { to { transform:rotate(360deg) } }
</style>
</head>
<body>
<header>
  <span class="logo">struktr</span>
  <span class="meta">PR {{PR}} · {{DEVICE_LABEL}}</span>
  <span class="status" id="status">{{STATUS}}</span>
</header>
<main>
  <div id="wait">
    <div class="spinner"></div>
    <p>Booting emulator &amp; installing the PR build…<br>usually ready in 60–90 seconds.</p>
  </div>
  <iframe id="frame" hidden allow="clipboard-write" src=""></iframe>
</main>
<script>
  const token = "{{TOKEN}}";
  const sessionId = "{{SESSION_ID}}";
  const statusEl = document.getElementById("status");
  const frame = document.getElementById("frame");
  const wait = document.getElementById("wait");

  async function poll() {
    try {
      const res = await fetch(location.pathname + "/status?t=" + encodeURIComponent(token));
      const data = await res.json();
      statusEl.textContent = data.status;
      if (data.status === "ready") {
        frame.src = "/s/" + sessionId + "/?token=" + encodeURIComponent(token);
        frame.hidden = false;
        wait.hidden = true;
        return;
      }
      if (data.status === "error") {
        wait.innerHTML = "<p>⚠️ Session failed: " + (data.error || "unknown") +
          "</p><p>Re-run the preview from the PR.</p>";
        return;
      }
    } catch { /* transient */ }
    setTimeout(poll, 3000);
  }
  poll();
</script>
</body>
</html>
